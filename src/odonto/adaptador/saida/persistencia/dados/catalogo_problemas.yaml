# Catálogo de problemas odontológicos (fonte única, lida pela migração 0002_catalogo_problemas).
#
# Referências:
#   - CID-10 (OMS / DATASUS), capítulo XI, K00-K14: doenças da cavidade oral, glândulas
#     salivares e maxilares; S02.5 (fratura de dente) e S03.2 (luxação de dente); B00.1,
#     B37.0, R19.6, R68.2, F45.8, T81, T85 e códigos Z de procedimentos.
#   - Especialidades odontológicas reconhecidas pelo Conselho Federal de Odontologia (CFO).
#
# O código CID-10 é só uma referência para o prontuário: quem diagnostica é o dentista.
# Para incluir ou alterar itens, edite este arquivo e crie uma nova migração (ver README).
# As palavras-chave são comparadas sem acento e sem diferenciar maiúsculas; escreva-as como o
# paciente escreveria. "prioridade" é a prioridade padrão do item (EMERGENCIA, URGENCIA, ROTINA).

problemas:
  # --- Dente e polpa (Dentística / Endodontia) ----------------------------------------------
  - codigo: CARIE
    nome: Cárie
    descricao: Buraco ou mancha escura no dente causada por bactérias.
    especialidade: Dentística
    prioridade: ROTINA
    cid10: K02.9
    palavras_chave: [cárie, carie, cariado, buraco no dente, dente furado, dente podre, dente preto, mancha preta no dente, comida entrando no dente]

  - codigo: DOR_DE_DENTE
    nome: Dor de dente
    descricao: Dor em um ou mais dentes, sem causa identificada pelo paciente.
    especialidade: Endodontia
    prioridade: URGENCIA
    cid10: K08.8
    palavras_chave: [dor de dente, dente doendo, dente dói, dente doi, dor no dente, dente latejando, dor no molar, dor no siso, odontalgia]

  - codigo: PULPITE
    nome: Pulpite
    descricao: Inflamação do nervo do dente, com dor forte, latejante ou ao tomar coisas geladas ou quentes.
    especialidade: Endodontia
    prioridade: URGENCIA
    cid10: K04.0
    palavras_chave: [pulpite, nervo do dente, nervo exposto, dor latejante, dor que não passa com remédio, dói com gelado e quente, dor à noite no dente, dor de noite no dente, dor que irradia]

  - codigo: ABSCESSO_SEM_FISTULA
    nome: Abscesso dentário (sem fístula)
    descricao: Infecção na ponta da raiz com dor e inchaço, sem saída de pus pela gengiva.
    especialidade: Endodontia
    prioridade: URGENCIA
    cid10: K04.7
    palavras_chave: [abscesso, abcesso, infecção no dente, infeccao no dente, dente inflamado, gengiva inchada no dente, inchaço no dente, dente inchado]

  - codigo: ABSCESSO_COM_FISTULA
    nome: Abscesso dentário (com fístula)
    descricao: Infecção na raiz que drena pus por uma "bolinha" na gengiva.
    especialidade: Endodontia
    prioridade: URGENCIA
    cid10: K04.6
    palavras_chave: [fístula, fistula, bolinha de pus, pus na gengiva, saindo pus, bolha na gengiva, carocinho de pus, gosto de pus]

  - codigo: NECROSE_PULPAR
    nome: Necrose pulpar
    descricao: O nervo do dente morreu; o dente pode ficar escurecido.
    especialidade: Endodontia
    prioridade: ROTINA
    cid10: K04.1
    palavras_chave: [necrose, dente morto, nervo morto, dente escurecido, dente ficou escuro, dente cinza]

  - codigo: TRATAMENTO_CANAL
    nome: Tratamento de canal
    descricao: Necessidade de iniciar, continuar ou refazer um tratamento de canal.
    especialidade: Endodontia
    prioridade: ROTINA
    cid10: K04.9
    palavras_chave: [canal, tratamento de canal, fazer canal, terminar o canal, refazer canal, retratamento, curativo do canal, endodontia]

  - codigo: PERIODONTITE_APICAL_AGUDA
    nome: Periodontite apical aguda
    descricao: Dor ao mastigar ou ao encostar no dente, com sensação de dente "alto".
    especialidade: Endodontia
    prioridade: ROTINA
    cid10: K04.4
    palavras_chave: [dói ao mastigar, doi ao mastigar, dor ao morder, dói quando mordo, dente alto, dói ao encostar, dor ao encostar no dente]

  # --- Gengiva e periodonto (Periodontia) ---------------------------------------------------
